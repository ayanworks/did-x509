name: CI
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    # labeled/unlabeled re-trigger CI so adding the `ci:full` label opts the
    # PR into the macOS/Windows legs, and removing it drops back to Ubuntu.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci
      working-directory: typescript

    - name: Typecheck
      run: npm run typecheck
      working-directory: typescript

    - name: Lint
      run: npm run lint
      working-directory: typescript

    - name: Run tests
      run: npm test
      working-directory: typescript

    - name: Build
      run: npm run build
      working-directory: typescript

  typescript-credo:
    name: Credo Module Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Build @didx509/core (linked package dependency)
      shell: bash
      working-directory: typescript
      run: |
        npm ci
        npm run build

    - name: Install dependencies
      shell: bash
      working-directory: typescript-credo
      run: npm ci

    - name: Typecheck and lint
      shell: bash
      working-directory: typescript-credo
      run: |
        npm run typecheck
        npm run lint

    - name: Test (spec vectors through Credo DidDocument)
      shell: bash
      working-directory: typescript-credo
      run: npm test

    - name: Build and pack the package
      shell: bash
      working-directory: typescript-credo
      run: |
        npm run build
        npm pack --dry-run

    # The published tarball must carry a semver range for the linked core
    # package, not the `file:` specifier used for development. This mirrors
    # the rewrite in the publish workflow.
    - name: Verify publishable manifest (linked dep rewritten)
      shell: bash
      working-directory: typescript-credo
      run: |
        core_version="$(node -p "require('../typescript/package.json').version")"
        node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@didx509/core'] = '^' + process.argv[1];
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
        " "$core_version"
        npm pack
        tar -xzOf ./didx509-credo-*.tgz package/package.json > /tmp/packed.json
        node -e "
          const packed = require('/tmp/packed.json');
          const spec = packed.dependencies['@didx509/core'];
          if (spec !== '^' + process.argv[1]) {
            console.error('Unexpected @didx509/core spec:', spec);
            process.exit(1);
          }
          console.log('Published @didx509/core spec:', spec);
        " "$core_version"

  examples:
    name: Signing Examples
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Build @didx509/core (linked package dependency)
      shell: bash
      working-directory: typescript
      run: |
        npm ci
        npm run build

    - name: Install dependencies
      shell: bash
      working-directory: examples
      run: npm ci

    - name: Run all examples
      shell: bash
      working-directory: examples
      run: npm run all

  playground:
    name: Playground Smoke Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Build @didx509/core (import-mapped package dependency)
      shell: bash
      working-directory: typescript
      run: |
        npm ci
        npm run build

    - name: Type-check the playground
      shell: bash
      working-directory: playground
      run: deno task check

    - name: Run every flow (resolve, JSON-LD VC, SD-JWT VC, mDoc)
      shell: bash
      working-directory: playground
      run: deno task all

  typescript-native:
    name: Native TypeScript Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu is the default everywhere: fast (~31 s) and reliable.
        # macOS/Windows run only when explicitly requested — the `ci:full`
        # label on a PR, pushes to main, or a manual workflow_dispatch — so
        # hosted-runner capacity outages (15 min queue timeouts) can't hold
        # up ordinary PR checks.
        os: >-
          ${{ fromJSON(
          (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
          && '["ubuntu-latest","macos-latest","windows-latest"]'
          || '["ubuntu-latest"]') }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # jom is a drop-in parallel nmake; OpenSSL's own nmake build is serial,
    # so this cuts a cold-cache Windows build from ~12 min to ~4 min.
    - name: Install jom (parallel nmake, Windows)
      if: runner.os == 'Windows'
      run: choco install jom -y --no-progress

    # Linux and Windows images ship OpenSSL < 3.3, which didx509cpp
    # rejects, so CI builds a cached static OpenSSL from source.
    # macOS images ship a current Homebrew openssl@3 (auto-detected).
    - name: Cache OpenSSL
      if: runner.os != 'macOS'
      uses: actions/cache@v4
      with:
        path: typescript-native/.openssl
        key: openssl-3.6.5-${{ runner.os }}-${{ runner.arch }}

    - name: Build OpenSSL from source
      if: runner.os != 'macOS'
      shell: bash
      working-directory: typescript-native
      run: node scripts/build-openssl.cjs

    - name: Build @didx509/core (cross-parity suite dependency)
      shell: bash
      working-directory: typescript
      run: |
        npm ci
        npm run build

    - name: Install @didx509/native (compiles the addon)
      shell: bash
      working-directory: typescript-native
      run: npm ci

    - name: Typecheck and lint
      shell: bash
      working-directory: typescript-native
      run: |
        npm run typecheck
        npm run lint

    - name: Test (220 upstream vectors, parity, API, plugin)
      shell: bash
      working-directory: typescript-native
      run: REQUIRE_CORE=true npm test

    - name: Build and smoke-test the package
      shell: bash
      working-directory: typescript-native
      run: |
        npm run build
        node scripts/runtime-smoke.mjs
        npm pack --dry-run

  typescript-native-bun:
    name: Bun Runtime Smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Cache OpenSSL
      uses: actions/cache@v4
      with:
        path: typescript-native/.openssl
        key: openssl-3.6.5-${{ runner.os }}-${{ runner.arch }}

    - name: Build OpenSSL from source
      working-directory: typescript-native
      run: node scripts/build-openssl.cjs

    - name: Install and build
      working-directory: typescript-native
      run: |
        npm ci
        npm run build

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Resolve a vector under Bun
      working-directory: typescript-native
      run: bun scripts/runtime-smoke.mjs

  typescript-native-deno:
    name: Deno Runtime Smoke (experimental)
    runs-on: ubuntu-latest
    # Deno's npm/FFI compatibility layer is verified manually today; keep
    # the job visible but non-blocking until denoland/deno#36596 settles.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Cache OpenSSL
      uses: actions/cache@v4
      with:
        path: typescript-native/.openssl
        key: openssl-3.6.5-${{ runner.os }}-${{ runner.arch }}

    - name: Build OpenSSL from source
      working-directory: typescript-native
      run: node scripts/build-openssl.cjs

    - name: Install and build
      working-directory: typescript-native
      run: |
        npm ci
        npm run build

    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Resolve a vector under Deno
      working-directory: typescript-native
      # No --node-modules-dir: the smoke imports only dist/ + node: built-ins
      # and the FFI addon. Letting Deno's npm resolver install the dev tree
      # trips its 24h minimum-dependency-age gate (refuses just-published
      # devDeps like typescript-eslint) — and the smoke needs none of them.
      run: >
        deno run --allow-ffi --allow-read --allow-env --allow-sys
        scripts/runtime-smoke.mjs
