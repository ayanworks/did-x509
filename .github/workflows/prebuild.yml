name: Prebuild & Publish

# Builds the redistributable native binaries for every supported platform,
# assembles them into the npm tarball, and (on version tags) publishes
# @didx509/native to npm with provenance.
#
# Tag scheme: this workflow fires on `native-v*` (e.g. native-v0.1.0), since
# @didx509/core and @didx509/credo version independently and publish from
# their own `core-v*` / `credo-v*` tags via publish.yml.
#
# Notes:
# - All binaries link OpenSSL statically (DIDX509_STATIC_OPENSSL=1) so end
#   users never need OpenSSL installed and never pick up an old system copy.
# - Linux jobs build a pinned OpenSSL from source: Ubuntu 22.04 ships 3.0
#   and didx509cpp requires >= 3.3.
# - Prebuild file names follow node-gyp-build's convention:
#   prebuilds/<platform>-<arch>/node.napi.node (untagged = glibc)
#   prebuilds/<platform>-<arch>/node.napi.musl.node (Alpine)
# - Linux builds run on ubuntu-22.04 so the binaries keep a glibc 2.35
#   baseline instead of inheriting ubuntu-latest's newer glibc.

on:
  push:
    tags:
      - 'native-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENSSL_VERSION: '3.6.5'

jobs:
  prebuild:
    name: Prebuild ${{ matrix.tag }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            tag: darwin-arm64
          - os: macos-15-intel
            tag: darwin-x64
          - os: ubuntu-22.04
            tag: linux-x64
          - os: ubuntu-22.04-arm
            tag: linux-arm64
          - os: windows-latest
            tag: win32-x64
    env:
      DIDX509_STATIC_OPENSSL: '1'
      CMAKE_OSX_DEPLOYMENT_TARGET: '10.15' # ignored off macOS
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache OpenSSL
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: typescript-native/.openssl
          key: openssl-${{ env.OPENSSL_VERSION }}-prebuild-${{ matrix.os }}-${{ runner.arch }}

      - name: Build OpenSSL from source (static)
        if: runner.os != 'macOS'
        shell: bash
        working-directory: typescript-native
        run: node scripts/build-openssl.cjs

      - name: Build addon and dist
        shell: bash
        working-directory: typescript-native
        run: |
          npm ci
          npm run build

      - name: Smoke test (resolve a specification vector)
        shell: bash
        working-directory: typescript-native
        run: node scripts/runtime-smoke.mjs

      - name: Stage prebuild
        shell: bash
        run: |
          mkdir -p prebuild-artifact/${{ matrix.tag }}
          cp typescript-native/build/Release/didx509_native.node \
             prebuild-artifact/${{ matrix.tag }}/node.napi.node

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.tag }}
          path: prebuild-artifact/
          if-no-files-found: error
          retention-days: 5

  prebuild-musl:
    name: Prebuild linux-x64-musl
    runs-on: ubuntu-latest
    env:
      DIDX509_STATIC_OPENSSL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Alpine needs its own toolchain (musl libc), so build inside Docker
      # rather than on the host runner. actions/checkout still runs on the
      # host, which avoids the known problem of JavaScript actions inside
      # Alpine containers.
      - name: Build inside Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /src \
            -e DIDX509_STATIC_OPENSSL=1 node:22-alpine sh -euxc '
              apk add --no-cache cmake make g++ perl linux-headers git python3
              cd typescript-native
              node scripts/build-openssl.cjs
              npm ci
              npm run build
              node scripts/runtime-smoke.mjs
              mkdir -p /src/prebuild-artifact/linux-x64
              cp build/Release/didx509_native.node \
                 /src/prebuild-artifact/linux-x64/node.napi.musl.node
            '

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-linux-x64-musl
          path: prebuild-artifact/
          if-no-files-found: error
          retention-days: 5

  package:
    name: Assemble npm package
    needs: [prebuild, prebuild-musl]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: typescript-native/prebuilds
          merge-multiple: true

      - name: Verify the prebuild set
        working-directory: typescript-native
        run: |
          ls -R prebuilds
          test -f prebuilds/darwin-arm64/node.napi.node
          test -f prebuilds/darwin-x64/node.napi.node
          test -f prebuilds/linux-x64/node.napi.node
          test -f prebuilds/linux-x64/node.napi.musl.node
          test -f prebuilds/linux-arm64/node.napi.node
          test -f prebuilds/win32-x64/node.napi.node

      - name: Install dependencies (skip source build) and build dist
        working-directory: typescript-native
        run: |
          npm ci --ignore-scripts
          npm run build

      # Runs the full 220-vector suite against the *assembled* linux-x64
      # prebuild through dist/, proving the packaged layout works end to end.
      - name: Smoke test assembled package
        working-directory: typescript-native
        run: node scripts/runtime-smoke.mjs

      - name: Pack
        working-directory: typescript-native
        run: |
          npm pack
          ls -la ./*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: typescript-native/*.tgz
          if-no-files-found: error

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: typescript-native
        run: |
          expected="native-v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected"
            exit 1
          fi

      - name: Publish to npm
        # Tags with the `native-v` prefix only. A `workflow_dispatch` run builds,
        # tests and packs but never publishes.
        if: startsWith(github.ref, 'refs/tags/native-v')
        working-directory: typescript-native
        # Trusted publishing (OIDC): no token. See publish.yml for details.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Re-runnable: npm refuses to publish a version that already exists,
          # and that 403 would fail this job and skip the release. Skipping the
          # publish keeps the release job running, so an already-published
          # version still gets its release page.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish."
            exit 0
          fi
          npm publish --access public

  # The native package gets a GitHub release for the same reason the other two
  # do: a release page that cannot drift from the published version. It is a
  # separate job so it can be re-run on its own — a failure here would
  # otherwise fail the package job, and re-running would stop at
  # `npm publish` with "cannot publish over the previously published versions".
  release:
    name: Release ${{ github.ref_name }}
    needs: package
    if: always() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/native-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./typescript-native/package.json').version")"
          # Re-runnable: a release that already exists is left alone.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "@didx509/native v$version" \
            --latest=false \
            --notes "Published to npm: https://www.npmjs.com/package/@didx509/native/v/$version

          Each \`@didx509/*\` package versions independently, so see the
          [per-package changelog](https://github.com/${{ github.repository }}/blob/main/typescript-native/CHANGELOG.md)
          and the npm page above for what changed."
